[pytest]
# Test discovery from the backend root — makes
#   docker compose run backend pytest
# (workdir /app) find tests/ without extra flags.
testpaths = tests

# Ensure `app` is importable regardless of the current working directory.
pythonpath = .

# Keep the default (fast) test runs quiet.
addopts = -q

# Run @pytest.mark.asyncio tests without per-test plugins.
asyncio_mode = auto
# Explicit loop scope for async fixtures (required by pytest-asyncio ≥ 0.24).
asyncio_default_fixture_loop_scope = function

filterwarnings =
    ignore::DeprecationWarning
