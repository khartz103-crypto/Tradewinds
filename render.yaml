# TradeWind AI — Render Blueprint
# =================================
# One-click deploy: push this repo to GitHub, then in the Render dashboard
# choose **New + → Blueprint** and select the repo. Render creates all four
# resources below (managed PostgreSQL, managed Redis/Key Value, FastAPI
# backend, Next.js frontend) and wires the URLs between them.
#
# Reference: https://render.com/docs/blueprint-spec
#
# NOTE on the `fromService` / `fromDatabase` / `fromRedis` references below:
# these are resolved by Render at deploy time to the actual internal URLs of
# the resources in this blueprint — no hardcoded hosts, ports, or secrets.

databases:
  - name: tradewind-db
    plan: free
    databaseName: tradewind
    user: tradewind

services:
  # ── Managed Redis (Key Value) ─────────────────────────────────────────
  # Free plan; the backend connects over the public internet, so the
  # allow-list is open. The connection string is injected into the backend
  # as REDIS_URL via fromService below.
  - type: keyvalue
    name: tradewind-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList:
      - source: 0.0.0.0/0
        description: anywhere (free plan connects over public internet)

  # ── FastAPI backend ───────────────────────────────────────────────────
  # Docker-based web service built from backend/Dockerfile. The start
  # command runs Alembic migrations + the seed script, then serves the API
  # on the port Render assigns ($PORT).
  - type: web
    name: tradewind-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      # Managed PostgreSQL (asyncpg needs the +asyncpg driver; the app's
      # config normalizes Render's plain postgresql:// connection string).
      - key: DATABASE_URL
        fromDatabase:
          name: tradewind-db
          property: connectionString
      # Managed Redis (Key Value) instance.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: tradewind-redis
          property: connectionString
      # JWT signing secret — auto-generated by Render at deploy time
      # (base64-encoded 256-bit value). Do NOT commit a real secret here.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY_HOURS
        value: "24"
      # CORS: allow the deployed frontend origin.
      # Render web services get a URL of the form https://<name>.onrender.com.
      # If Render assigns a different URL (e.g. due to a name collision),
      # update this value to match the actual frontend URL shown in the
      # Render dashboard after the first deploy.
      - key: CORS_ORIGINS
        value: https://tradewind-frontend.onrender.com
      - key: SEED_ADMIN_EMAIL
        value: admin@tradewind.ai
      # Prompted in the Render dashboard at deploy time — choose a strong
      # password for the seeded admin user.
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Alpaca paper-trading credentials — prompted at deploy time. Get free
      # paper keys at https://app.alpaca.markets. The app runs in UI-only
      # mode if these are left blank (backend still boots fine).
      - key: ALPACA_API_KEY_ID
        sync: false
      - key: ALPACA_API_SECRET_KEY
        sync: false
      # Paper trading endpoints (default). Switch to https://api.alpaca.markets
      # ONLY if live trading is explicitly enabled — TradeWind AI defaults to paper.
      - key: ALPACA_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: ALPACA_DATA_URL
        value: https://data.alpaca.markets
      - key: MARKET_DATA_CACHE_TTL_MINUTES
        value: "15"
      - key: DEBUG
        value: "false"

  # ── Next.js frontend ───────────────────────────────────────────────────
  # Docker-based web service built from frontend/Dockerfile. Render injects
  # service env vars as Docker build arguments, so NEXT_PUBLIC_BACKEND_URL
  # is baked into the client bundle at `next build` time (see the
  # `ARG NEXT_PUBLIC_BACKEND_URL` line in frontend/Dockerfile).
  #
  # The value is the backend's public Render URL WITHOUT an /api suffix:
  # the frontend's api client (frontend/src/lib/api.ts) already prefixes
  # every request path with /api itself.
  - type: web
    name: tradewind-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    envVars:
      # Backend API URL — hardcoded to the expected Render service URL.
      # If Render assigns a different URL (name collision), update this
      # from the Render dashboard to match the actual backend URL.
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://tradewind-backend.onrender.com
